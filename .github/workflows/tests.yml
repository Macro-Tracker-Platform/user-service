name: Tests

on:
  push:
    branches:
      - main
      - dev
      - 'feature/*'
      - 'hotfix/*'
      - 'release/*'
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Configure Maven settings
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<EOF
          <settings>
          <servers>
          <server>
          <id>github</id>
          <username>oleh-prukhnytskyi</username>
          <password>${PACKAGES_PASSWORD}</password>
          </server>
          </servers>
          </settings>
          EOF
        env:
          PACKAGES_PASSWORD: ${{ secrets.PACKAGES_PASSWORD }}

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Run Tests
        run: mvn test
