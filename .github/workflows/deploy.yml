name: Build & Push Docker Image

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure Maven settings
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<EOF
          <settings>
          <servers>
          <server>
          <id>github</id>
          <username>oleh-prukhnytskyi</username>
          <password>${PACKAGES_TOKEN}</password>
          </server>
          </servers>
          </settings>
          EOF
        env:
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build project (Maven)
        run: mvn -B clean package -DskipTests

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/macro-tracker-user-service:latest .

      - name: Push to Docker Hub
        run: docker push ${{ secrets.DOCKER_USERNAME }}/macro-tracker-user-service:latest

      - name: Trigger server update
        run: |
          curl -X POST ${{ secrets.SERVER_URL }} \
            -H "X-Secret-Token: ${{ secrets.SECRET_TOKEN }}"
