spring.datasource.url=jdbc:h2:mem:test_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.platform=h2

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=true

jwt.key-id=jwt_key_id
jwt.access-token-ttl-minutes=5
jwt.refresh-token-ttl-days=30
jwt.public-key=jwt_public_key
jwt.private-key=jwt_private_key

social.google.client_id=client_id
social.facebook.app_id=facebook_app_id
social.facebook.app_secret=facebook_app_secret

feign.goal-service=http://localhost:8080

swagger.public-url=http://public.url
