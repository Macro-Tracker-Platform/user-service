databaseChangeLog:
  - changeSet:
      id: 23-add-voice-food-scan-credits
      author: codex
      changes:
        - sql:
            sql: >-
              ALTER TABLE users ADD COLUMN voice_food_scan_credits
              INTEGER DEFAULT 5 NOT NULL
        - sql:
            sql: >-
              ALTER TABLE users
              ADD CONSTRAINT chk_users_voice_food_scan_credits_non_negative
              CHECK (voice_food_scan_credits >= 0)
        - createTable:
            tableName: voice_food_scan_consumptions
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: idempotency_key
                  type: VARCHAR(128)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: voice_food_scan_consumptions
            columnNames: user_id, idempotency_key
            constraintName: uk_voice_food_scan_consumption_user_key
        - addForeignKeyConstraint:
            baseTableName: voice_food_scan_consumptions
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_voice_food_scan_consumption_user
            onDelete: CASCADE
      rollback:
        - dropTable:
            tableName: voice_food_scan_consumptions
        - sql:
            sql: >-
              ALTER TABLE users
              DROP CONSTRAINT chk_users_voice_food_scan_credits_non_negative
        - dropColumn:
            tableName: users
            columnName: voice_food_scan_credits
