databaseChangeLog:
  - changeSet:
      id: 17-add-insert-affiliate-fields-to-promo-codes
      author: codex
      changes:
        - addColumn:
            tableName: promo_codes
            columns:
              - column:
                  name: insert_affiliate_id
                  type: VARCHAR(255)
              - column:
                  name: insert_affiliate_short_code
                  type: VARCHAR(64)
        - createIndex:
            tableName: promo_codes
            indexName: idx_promo_codes_insert_affiliate_id
            columns:
              - column:
                  name: insert_affiliate_id
