databaseChangeLog:
  - changeSet:
      id: 22-create-food-photo-scan-consumptions
      author: codex
      changes:
        - createTable:
            tableName: food_photo_scan_consumptions
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: idempotency_key
                  type: VARCHAR(128)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: food_photo_scan_consumptions
            columnNames: user_id, idempotency_key
            constraintName: uk_food_photo_scan_consumption_user_key
        - addForeignKeyConstraint:
            baseTableName: food_photo_scan_consumptions
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_food_photo_scan_consumption_user
            onDelete: CASCADE
      rollback:
        - dropTable:
            tableName: food_photo_scan_consumptions
