databaseChangeLog:
  - changeSet:
      id: 1787356800000-1
      author: codex
      changes:
        - update:
            tableName: user_profiles
            columns:
              - column:
                  name: water_goal_ml
                  valueComputed: CAST(LEAST(4000, GREATEST(1500, ROUND((CASE WHEN weight <= 25.0 * POWER(height / 100.0, 2) THEN weight ELSE 25.0 * POWER(height / 100.0, 2) + ((weight - 25.0 * POWER(height / 100.0, 2)) * 0.4) END) * 35.0 / 50.0) * 50)) AS INTEGER)
            where: water_goal_mode = 'AUTO'
