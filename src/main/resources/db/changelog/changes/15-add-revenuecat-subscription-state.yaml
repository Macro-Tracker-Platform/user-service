databaseChangeLog:
  - changeSet:
      id: 15-add-revenuecat-subscription-state
      author: codex
      changes:
        - addColumn:
            tableName: users
            columns:
              - column:
                  name: is_subscribed
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: subscription_event_timestamp_ms
                  type: BIGINT
        - addDefaultValue:
            tableName: users
            columnName: is_subscribed
            columnDataType: BOOLEAN
            defaultValueBoolean: false
        - createTable:
            tableName: revenuecat_events
            columns:
              - column:
                  name: id
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: revenuecat_events_pkey
              - column:
                  name: event_type
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: app_user_id
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: event_timestamp_ms
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: processed_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
