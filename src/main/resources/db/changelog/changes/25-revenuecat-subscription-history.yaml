databaseChangeLog:
  - changeSet:
      id: 25-revenuecat-subscription-history
      author: codex
      changes:
        - createTable:
            tableName: revenuecat_subscriptions
            columns:
              - column:
                  name: id
                  type: VARCHAR(64)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: store
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
              - column:
                  name: original_transaction_id
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: product_id
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: period_type
                  type: VARCHAR(32)
              - column:
                  name: expires_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: active
                  type: BOOLEAN
                  constraints:
                    nullable: false
              - column:
                  name: event_timestamp_ms
                  type: BIGINT
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: revenuecat_subscriptions
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_revenuecat_subscriptions_user
            onDelete: CASCADE
        - createIndex:
            tableName: revenuecat_subscriptions
            indexName: idx_revenuecat_subscriptions_user
            columns:
              - column:
                  name: user_id
