spring.application.name=macro-tracker-user-service

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}

social.google.client_id=${GOOGLE_CLIENT_ID}
social.facebook.app_id=${FACEBOOK_APP_ID}
social.facebook.app_secret=${FACEBOOK_APP_SECRET}

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

feign.goal-service=${FEIGN_GOAL_SERVICE}

spring.kafka.bootstrap-servers=${KAFKA_URL}
spring.kafka.admin.auto-create=true
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

spring.data.redis.url=${REDIS_URL}

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui

logging.level.root=INFO
logging.level.com.olehprukhnytskyi.macrotrackeruserservice=DEBUG
