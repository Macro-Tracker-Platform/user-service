spring.application.name=macro-tracker-user-service

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}

social.google.client_id=${GOOGLE_CLIENT_ID}
social.facebook.app_id=${FACEBOOK_APP_ID}
social.facebook.app_secret=${FACEBOOK_APP_SECRET}

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

feign.goal-service=${GOAL_SERVICE_URL}

spring.kafka.bootstrap-servers=${KAFKA_URL}
spring.kafka.admin.auto-create=true
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

spring.data.redis.url=${REDIS_URL}

springdoc.api-docs.path=/api-docs
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=false

logging.level.root=INFO
logging.level.com.olehprukhnytskyi.macrotrackeruserservice=INFO

management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
spring.cloud.discovery.enabled=false
