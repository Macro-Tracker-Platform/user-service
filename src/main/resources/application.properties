spring.application.name=macro-tracker-user-service

jwt.key-id=${JWT_KEY_ID}
jwt.access-token-ttl-minutes=${JWT_ACCESS_TOKEN_TTL_MINUTES:5}
jwt.refresh-token-ttl-days=${JWT_REFRESH_TOKEN_TTL_DAYS:30}
jwt.public-key=${JWT_PUBLIC_KEY}
jwt.private-key=${JWT_PRIVATE_KEY}

social.google.client_id=${GOOGLE_CLIENT_ID}
social.facebook.app_id=${FACEBOOK_APP_ID}
social.facebook.app_secret=${FACEBOOK_APP_SECRET}

google.play.package-name=${GOOGLE_PLAY_PACKAGE_NAME:com.olehprukhnytskyi.macrotracker}
google.play.product-ids=${GOOGLE_PLAY_PRODUCT_IDS:macrotracker_pro}
google.play.purchase-token-key=${GOOGLE_PLAY_PURCHASE_TOKEN_KEY}
google.play.rtdn-audience=${GOOGLE_PLAY_RTDN_AUDIENCE}
google.play.rtdn-service-account-email=${GOOGLE_PLAY_RTDN_SERVICE_ACCOUNT_EMAIL}
google.play.quota-zone=${GOOGLE_PLAY_QUOTA_ZONE:UTC}
google.play.trial-offer-ids=${GOOGLE_PLAY_TRIAL_OFFER_IDS}

revenuecat.webhook-authorization=${REVENUECAT_WEBHOOK_AUTHORIZATION}

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?tcpKeepAlive=true&sslmode=disable
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

spring.kafka.bootstrap-servers=${KAFKA_URL}
spring.kafka.admin.auto-create=true
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

spring.data.redis.url=${REDIS_URL}

springdoc.api-docs.path=/api-docs
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=false
swagger.public-url=${MACRO_TRACKER_URL}

logging.level.root=INFO

management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
spring.cloud.discovery.enabled=false
