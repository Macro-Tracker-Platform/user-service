spring.application.name=macro-tracker-user-service
spring.main.banner-mode=off

jwt.key-id=${JWT_KEY_ID}
jwt.access-token-ttl-minutes=${JWT_ACCESS_TOKEN_TTL_MINUTES:5}
jwt.refresh-token-ttl-days=${JWT_REFRESH_TOKEN_TTL_DAYS:30}
jwt.public-key=${JWT_PUBLIC_KEY}
jwt.private-key=${JWT_PRIVATE_KEY}

social.google.client_id=${GOOGLE_CLIENT_ID}
social.facebook.app_id=${FACEBOOK_APP_ID}
social.facebook.app_secret=${FACEBOOK_APP_SECRET}
social.apple.client-ids=${APPLE_CLIENT_IDS}

google.play.package-name=${GOOGLE_PLAY_PACKAGE_NAME:com.olehprukhnytskyi.macrotracker}
google.play.product-ids=${GOOGLE_PLAY_PRODUCT_IDS:macrotracker_pro}
google.play.purchase-token-key=${GOOGLE_PLAY_PURCHASE_TOKEN_KEY}
google.play.rtdn-audience=${GOOGLE_PLAY_RTDN_AUDIENCE}
google.play.rtdn-service-account-email=${GOOGLE_PLAY_RTDN_SERVICE_ACCOUNT_EMAIL}
google.play.quota-zone=${GOOGLE_PLAY_QUOTA_ZONE:UTC}
google.play.trial-offer-ids=${GOOGLE_PLAY_TRIAL_OFFER_IDS:yearly-21-day-trial,promo-10-new-year}
google.play.promo-trial-offer-id=${GOOGLE_PLAY_PROMO_TRIAL_OFFER_ID:promo-10-new-year}

ai-credits.free-daily-limit=${AI_CREDITS_FREE_DAILY_LIMIT:3}
ai-credits.quota-zone=${AI_CREDITS_QUOTA_ZONE:UTC}

revenuecat.webhook-authorization=${REVENUECAT_WEBHOOK_AUTHORIZATION}
revenuecat.promo-yearly-product-id=${APPLE_PROMO_YEARLY_PRODUCT_ID:yearly_promo_15}
revenuecat.promo-monthly-product-id=${APPLE_PROMO_MONTHLY_PRODUCT_ID:monthly_promo_15}

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?tcpKeepAlive=true&sslmode=disable
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

spring.kafka.bootstrap-servers=${KAFKA_URL}
spring.kafka.admin.auto-create=true
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

spring.data.redis.url=${REDIS_URL}

springdoc.api-docs.path=/api-docs
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=false
swagger.public-url=${MACRO_TRACKER_URL}

logging.level.root=INFO

management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
spring.cloud.discovery.enabled=false

web-billing.enabled=${WEB_BILLING_ENABLED:false}
web-billing.stripe-secret-key=${STRIPE_SECRET_KEY:}
web-billing.stripe-webhook-secret=${STRIPE_WEBHOOK_SECRET:}
web-billing.live-mode=${WEB_BILLING_LIVE_MODE:false}
web-billing.monthly-price-id=${STRIPE_MONTHLY_PRICE_ID:}
web-billing.yearly-price-id=${STRIPE_YEARLY_PRICE_ID:}
web-billing.success-url=${WEB_BILLING_SUCCESS_URL:}
web-billing.cancel-url=${WEB_BILLING_CANCEL_URL:}
web-billing.yearly-trial-days=${WEB_BILLING_YEARLY_TRIAL_DAYS:7}
web-billing.portal-return-url=${WEB_BILLING_PORTAL_RETURN_URL:}
web-auth.allowed-origins=${WEB_AUTH_ALLOWED_ORIGINS:https://macrotracker.uk}
web-auth.google-client-id=${WEB_AUTH_GOOGLE_CLIENT_ID:}
web-auth.apple-service-id=${WEB_AUTH_APPLE_SERVICE_ID:}
web-auth.apple-redirect-uri=${WEB_AUTH_APPLE_REDIRECT_URI:}
revenuecat.subscriber-api-key=${REVENUECAT_SUBSCRIBER_API_KEY:}
revenuecat.stripe-api-key=${REVENUECAT_STRIPE_API_KEY:}
web-billing.mobile-portal-configuration-id=${STRIPE_MOBILE_PORTAL_CONFIGURATION_ID:}
web-billing.mobile-portal-return-url=${WEB_BILLING_MOBILE_PORTAL_RETURN_URL:}
revenuecat.environment=${REVENUECAT_ENVIRONMENT:PRODUCTION}